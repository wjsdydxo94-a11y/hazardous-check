<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위험물 저장소 일일점검표</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen py-8 px-4 flex items-center justify-center">
    <div class="max-w-lg w-full bg-white shadow-2xl rounded-2xl border border-slate-100 overflow-hidden">
        
        <!-- 상단 헤더 배너 -->
        <div class="bg-slate-900 text-white px-6 py-6 text-center relative">
            <div class="absolute top-3 right-4 text-[11px] bg-blue-500/20 text-blue-300 px-2.5 py-1 rounded-full font-medium border border-blue-500/30">법정 안전점검</div>
            <h1 class="text-xl font-bold tracking-tight mb-1">위험물 저장소 일일점검표</h1>
            <p class="text-xs text-slate-400">현장 정기 점검 항목을 정확히 확인 후 제출해 주세요.</p>
        </div>
        
        <form action="/submit" method="POST" class="p-6 space-y-5">
            
            <!-- 업체 선택 -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">점검 업체</label>
                <div class="relative">
                    <select name="company" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none appearance-none" required>
                        <option value="아로마솔루션">아로마솔루션</option>
                        <option value="아로마리소스">아로마리소스</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>

            <!-- 점검자 성명 -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">점검자 성명</label>
                <input type="text" name="inspector" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none" placeholder="성명을 입력하세요">
            </div>
            
            <!-- 법정 안전 점검 항목 그룹 -->
            <div class="space-y-4 pt-2 border-t border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">법정 안전 점검 항목</p>

                <!-- 1. 용기 상태 -->
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80">
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">1. 용기 상태 (외관/균열/누출)</label>
                    <select name="fire_ext" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 transition-all outline-none">
                        <option value="이상없음">✔ 이상없음 (정상)</option>
                        <option value="정비필요">✘ 정비필요</option>
                        <option value="점검불가">✘ 점검불가</option>
                    </select>
                </div>

                <!-- 2. 환기·배출설비 -->
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80">
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">2. 환기·배출설비 (환기팬/검지기)</label>
                    <select name="alarm" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 transition-all outline-none">
                        <option value="이상없음">✔ 이상없음 (정상)</option>
                        <option value="정비필요">✘ 정비필요</option>
                        <option value="점검불가">✘ 점검불가</option>
                    </select>
                </div>

                <!-- 3. 소화·경보설비 -->
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80">
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">3. 소화·경보설비 (소화기/경보기)</label>
                    <select name="vent" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 transition-all outline-none">
                        <option value="이상없음">✔ 이상없음 (정상)</option>
                        <option value="정비필요">✘ 정비필요</option>
                        <option value="점검불가">✘ 점검불가</option>
                    </select>
                </div>

                <!-- 4. 게시판 및 화기엄금 -->
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80">
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">4. 게시판 및 화기엄금 (표지/주변정리)</label>
                    <select name="leak" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 transition-all outline-none">
                        <option value="이상없음">✔ 이상없음 (준수)</option>
                        <option value="미흡">✘ 개선 필요</option>
                    </select>
                </div>
            </div>

            <!-- 온도 및 습도 -->
            <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-100">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">저장소 온도 (℃)</label>
                    <input type="number" step="0.1" name="temp" placeholder="예: 22.5" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">저장소 습도 (%)</label>
                    <input type="number" step="1" name="humidity" placeholder="예: 55" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none">
                </div>
            </div>

            <!-- 특이사항 -->
            <div class="pt-2 border-t border-slate-100">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">특이사항</label>
                <textarea name="remarks" rows="2" placeholder="특이사항이 있을 경우 입력하세요" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none resize-none"></textarea>
            </div>

            <!-- 제출 버튼 -->
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3.5 px-4 rounded-xl hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg shadow-blue-500/25 active:scale-[0.99] mt-2">
                점검 결과 안전 제출하기
            </button>
        </form>
    </div>
</body>
</html>
