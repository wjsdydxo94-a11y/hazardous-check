<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위험물 저장소 일일점검표</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div class="max-w-md mx-auto p-4 my-6 bg-white shadow-lg rounded-xl border border-slate-200">
        <h1 class="text-xl font-bold text-slate-800 mb-2 text-center">위험물 저장소 일일점검표</h1>
        <p class="text-xs text-slate-500 mb-6 text-center">현장 정기 점검 항목을 정확히 확인 후 제출해주세요.</p>
        
        <form action="/submit" method="POST" class="space-y-4">
            <!-- 업체 선택 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">점검 업체</label>
                <select name="company" class="w-full px-3 py-2 border rounded-lg text-sm bg-white" required>
                    <option value="아로마솔루션">아로마솔루션</option>
                    <option value="아로마리소스">아로마리소스</option>
                </select>
            </div>

            <!-- 점검자 성명 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">점검자 성명</label>
                <input type="text" name="inspector" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm" placeholder="성명을 입력하세요">
            </div>
            
            <!-- 1. 용기 상태 -->
            <div class="border-t pt-3">
                <label class="block text-sm font-semibold text-slate-700 mb-1">1. 용기 상태 (외관/균열/누출)</label>
                <select name="fire_ext" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                    <option value="이상없음">이상없음 (정상)</option>
                    <option value="정비필요">정비필요</option>
                    <option value="점검불가">점검불가</option>
                </select>
            </div>

            <!-- 2. 환기·배출설비 -->
            <div class="border-t pt-3">
                <label class="block text-sm font-semibold text-slate-700 mb-1">2. 환기·배출설비 (환기팬/검지기)</label>
                <select name="alarm" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                    <option value="이상없음">이상없음 (정상)</option>
                    <option value="정비필요">정비필요</option>
                    <option value="점검불가">점검불가</option>
                </select>
            </div>

            <!-- 3. 소화·경보설비 -->
            <div class="border-t pt-3">
                <label class="block text-sm font-semibold text-slate-700 mb-1">3. 소화·경보설비 (소화기/경보기)</label>
                <select name="vent" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                    <option value="이상없음">이상없음 (정상)</option>
                    <option value="정비필요">정비필요</option>
                    <option value="점검불가">점검불가</option>
                </select>
            </div>

            <!-- 4. 게시판 및 화기엄금 -->
            <div class="border-t pt-3">
                <label class="block text-sm font-semibold text-slate-700 mb-1">4. 게시판 및 화기엄금 (표지/주변정리)</label>
                <select name="leak" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                    <option value="이상없음">이상없음 (준수)</option>
                    <option value="미흡">개선 필요</option>
                </select>
            </div>

            <!-- 온도 및 습도 -->
            <div class="grid grid-cols-2 gap-3 border-t pt-3">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">저장소 온도 (℃)</label>
                    <input type="number" step="0.1" name="temp" placeholder="예: 22.5" required class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">저장소 습도 (%)</label>
                    <input type="number" step="1" name="humidity" placeholder="예: 55" required class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
            </div>

            <!-- 특이사항 -->
            <div class="border-t pt-3">
                <label class="block text-sm font-semibold text-slate-700 mb-1">특이사항</label>
                <textarea name="remarks" rows="2" placeholder="특이사항이 있을 경우 입력" class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition shadow-md mt-4">
                점검 결과 제출하기
            </button>
        </form>
    </div>
</body>
</html>
