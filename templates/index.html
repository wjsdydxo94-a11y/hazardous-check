<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위험물 저장소 정밀 점검표</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Pretendard', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen py-8 px-4 flex items-center justify-center">
    <div class="max-w-lg w-full bg-white shadow-2xl rounded-2xl border border-slate-100 overflow-hidden">
        
        <div class="bg-slate-900 text-white px-6 py-6 text-center relative">
            <div class="absolute top-3 right-4 text-[11px] bg-blue-500/20 text-blue-300 px-2.5 py-1 rounded-full font-medium border border-blue-500/30">전문 소방점검 양식</div>
            <h1 class="text-xl font-bold tracking-tight mb-1">위험물 저장소 정밀 일일점검표</h1>
            <p class="text-xs text-slate-400">일진소방 점검 기준에 맞춰 세부 항목을 정확히 기록하세요.</p>
        </div>
        
        <form action="/submit" method="POST" class="p-6 space-y-5">
            
            <!-- 업체 및 점검자 정보 -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">점검 업체</label>
                    <select name="company" class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none" required>
                        <option value="아로마솔루션">아로마솔루션</option>
                        <option value="아로마리소스">아로마리소스</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">점검자 성명</label>
                    <input type="text" name="inspector" required class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="성명 입력">
                </div>
            </div>
            
            <!-- 전문 소방 점검 항목 -->
            <div class="space-y-4 pt-2 border-t border-slate-100">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">소방안전관리 세부 점검내역</p>

                <!-- 1. 소방 및 안전설비 건전성 -->
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80">
                    <label class="block text-xs font-bold text-slate-700 mb-1">1. 소방 및 안전설비 건전성</label>
                    <p class="text-[11px] text-slate-500 mb-2">소화기 압력, 환기·배출팬, 경보설비 정상 작동 여부</p>
                    <select name="facility" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="양호">✔ 양호 (적합)</option>
                        <option value="정비요함">✘ 정비요함 (조치필요)</option>
                        <option value="불량">✘ 불량</option>
                    </select>
                </div>

                <!-- 2. 시설 및 누출 방지 관리 -->
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80">
                    <label class="block text-xs font-bold text-slate-700 mb-1">2. 시설 및 누출 방지 관리</label>
                    <p class="text-[11px] text-slate-500 mb-2">용기 외관/균열 점검 및 누출·비산 방지 설비 유지관리</p>
                    <select name="leak_mgmt" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="양호">✔ 양호 (적합)</option>
                        <option value="정비요함">✘ 정비요함 (조치필요)</option>
                        <option value="불량">✘ 불량</option>
                    </select>
                </div>

                <!-- 3. 방화환경 및 위험물 표지 -->
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80">
                    <label class="block text-xs font-bold text-slate-700 mb-1">3. 방화환경 및 위험물 표지</label>
                    <p class="text-[11px] text-slate-500 mb-2">주의·경고·금연 표지판 부착 및 가연물 적치 금지 준수</p>
                    <select name="environment" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="양호">✔ 양호 (적합)</option>
                        <option value="정비요함">✘ 정비요함 (조치필요)</option>
                        <option value="불량">✘ 불량</option>
                    </select>
                </div>

                <!-- 4. 종사자 교육 및 연락체계 -->
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200/80">
                    <label class="block text-xs font-bold text-slate-700 mb-1">4. 종사자 교육 및 연락체계</label>
                    <p class="text-[11px] text-slate-500 mb-2">안전수칙 교육 이행 및 비상시 응급조치 연락체계 숙지</p>
                    <select name="education" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="양호">✔ 양호 (적합)</option>
                        <option value="정비요함">✘ 정비요함 (조치필요)</option>
                        <option value="불량">✘ 불량</option>
                    </select>
                </div>
            </div>

            <!-- 온습도 및 재고량 (일진소방 양식의 보유재고 반영) -->
            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">온도 (℃)</label>
                    <input type="number" step="0.1" name="temp" placeholder="22.5" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">습도 (%)</label>
                    <input type="number" step="1" name="humidity" placeholder="55" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">보유재고 (kg)</label>
                    <input type="text" name="stock" placeholder="예: 0 kg" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 outline-none">
                </div>
            </div>

            <!-- 특이사항 및 조치내용 -->
            <div class="pt-2 border-t border-slate-100">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">점검지시 및 조치사항</label>
                <textarea name="remarks" rows="2" placeholder="특이사항 및 조치 내용 입력 (예: 소화기 이상없음)" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 outline-none resize-none"></textarea>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3.5 px-4 rounded-xl hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg shadow-blue-500/25 active:scale-[0.99] mt-2">
                정밀 점검 결과 제출하기
            </button>
        </form>
    </div>
</body>
</html>
