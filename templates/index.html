<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위험물 주간 점검시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Pretendard', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50/30 to-slate-100 min-h-screen py-8 px-4 flex items-center justify-center">
    <div class="max-w-lg w-full bg-white/90 backdrop-blur-md shadow-xl rounded-3xl border border-white overflow-hidden">
        
        <!-- 상단 헤더: 밝고 세련된 그라데이션 적용 -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-6 py-7 text-center relative shadow-md">
            <div class="absolute top-3 right-4 text-[11px] bg-white/20 text-white px-2.5 py-1 rounded-full font-semibold tracking-wide backdrop-blur-sm">주간 정밀 점검</div>
            <h1 class="text-xl font-bold tracking-tight mb-1">위험물 주간 점검시스템</h1>
            <p class="text-xs text-blue-100 font-medium">각 점검 항목별 상태 및 특이사항을 정확히 입력해 주세요.</p>
        </div>
        
        <form action="/submit" method="POST" class="p-6 space-y-5">
            
            <!-- 업체 및 점검자 정보 -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">점검 업체</label>
                    <select name="company" class="w-full px-3.5 py-3 bg-white border border-slate-200 rounded-2xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm transition">
                        <option value="아로마솔루션">아로마솔루션</option>
                        <option value="아로마리소스">아로마리소스</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">점검자 성명</label>
                    <input type="text" name="inspector" required class="w-full px-3.5 py-3 bg-white border border-slate-200 rounded-2xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm transition" placeholder="성명 입력">
                </div>
            </div>
            
            <!-- 항목별 세부 점검내역 및 개별 특이사항 -->
            <div class="space-y-4 pt-2 border-t border-slate-100">
                <p class="text-xs font-bold text-blue-600 uppercase tracking-wider">소방안전관리 4대 점검 항목 및 개별 조치내용</p>

                <!-- 1. 건축물 구조 및 피뢰설비 -->
                <div class="bg-slate-50/80 p-4 rounded-2xl border border-slate-200/60 space-y-2.5 shadow-sm hover:border-blue-200 transition">
                    <label class="block text-xs font-bold text-slate-800">1. 건축물 구조 및 피뢰설비</label>
                    <p class="text-[11px] text-slate-500">건축물 균열·변형 및 피뢰침·접지선 상태</p>
                    <select name="item1_status" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
                        <option value="양호">✔ 양호 (적합)</option>
                        <option value="정비요함">✘ 정비요함 (조치필요)</option>
                        <option value="불량">✘ 불량</option>
                    </select>
                    <input type="text" name="item1_remark" placeholder="1번 항목 특이사항 및 조치내용 (선택)" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-700 outline-none shadow-sm">
                </div>

                <!-- 2. 소방 및 환기·배출설비 -->
                <div class="bg-slate-50/80 p-4 rounded-2xl border border-slate-200/60 space-y-2.5 shadow-sm hover:border-blue-200 transition">
                    <label class="block text-xs font-bold text-slate-800">2. 소방 및 환기·배출설비</label>
                    <p class="text-[11px] text-slate-500">소화기 압력 및 환기팬 정상 작동 상태</p>
                    <select name="item2_status" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
                        <option value="양호">✔ 양호 (적합)</option>
                        <option value="정비요함">✘ 정비요함 (조치필요)</option>
                        <option value="불량">✘ 불량</option>
                    </select>
                    <input type="text" name="item2_remark" placeholder="2번 항목 특이사항 및 조치내용 (선택)" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-700 outline-none shadow-sm">
                </div>

                <!-- 3. 표지판 및 위험물 저장·취급 -->
                <div class="bg-slate-50/80 p-4 rounded-2xl border border-slate-200/60 space-y-2.5 shadow-sm hover:border-blue-200 transition">
                    <label class="block text-xs font-bold text-slate-800">3. 표지판 및 위험물 저장·취급</label>
                    <p class="text-[11px] text-slate-500">표지판 부착 및 가연성 폐기물 적치 여부</p>
                    <select name="item3_status" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
                        <option value="양호">✔ 양호 (적합)</option>
                        <option value="정비요함">✘ 정비요함 (조치필요)</option>
                        <option value="불량">✘ 불량</option>
                    </select>
                    <input type="text" name="item3_remark" placeholder="3번 항목 특이사항 및 조치내용 (선택)" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-700 outline-none shadow-sm">
                </div>

                <!-- 4. 온습도 및 누출·비산 방지 -->
                <div class="bg-slate-50/80 p-4 rounded-2xl border border-slate-200/60 space-y-2.5 shadow-sm hover:border-blue-200 transition">
                    <label class="block text-xs font-bold text-slate-800">4. 온습도 및 누출·비산 방지</label>
                    <p class="text-[11px] text-slate-500">온습도 유지 및 용기 하단 누유·누수 여부</p>
                    <select name="item4_status" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
                        <option value="양호">✔ 양호 (적합)</option>
                        <option value="정비요함">✘ 정비요함 (조치필요)</option>
                        <option value="불량">✘ 불량</option>
                    </select>
                    <input type="text" name="item4_remark" placeholder="4번 항목 특이사항 및 조치내용 (선택)" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-700 outline-none shadow-sm">
                </div>
            </div>

            <!-- 온습도 입력 -->
            <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-100">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">저장소 온도 (℃)</label>
                    <input type="number" step="0.1" name="temp" placeholder="예: 22.5" required class="w-full px-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm font-semibold text-slate-800 outline-none shadow-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">저장소 습도 (%)</label>
                    <input type="number" step="1" name="humidity" placeholder="예: 55" required class="w-full px-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm font-semibold text-slate-800 outline-none shadow-sm">
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-4 px-4 rounded-2xl hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg shadow-blue-500/25 active:scale-[0.99] mt-2">
                정밀 점검 결과 제출하기
            </button>
        </form>
    </div>
</body>
</html>
